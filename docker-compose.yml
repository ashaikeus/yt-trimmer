services:
  redis:
    image: redis:7-alpine
    ports:
      - ${REDIS_PORT}:6379

  api:
    build: .
    env_file:
      - .env
    ports:
      - ${API_PORT}:8000
    depends_on:
      - redis
    environment:
      PYTHONPATH: /yt-trimmer/src
    volumes:
      - ./downloads:/yt-trimmer/downloads

  worker:
    build: .
    env_file:
      - .env
    command: uv run rq worker
    depends_on:
      - redis
    environment:
      PYTHONPATH: /yt-trimmer/src
    volumes:
      - ./downloads:/yt-trimmer/downloads

  scheduler:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      PYTHONPATH: /yt-trimmer/src
    command: sh -c "uv run python -m scheduler && uv run rqscheduler --host ${REDIS_HOST}"